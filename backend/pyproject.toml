[project]
name = "cmp-backend"
version = "0.1.0"
description = "Clone My Professor — backend (API, core, ingestion, retrieval, model layer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "litellm>=1.60",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "procrastinate>=3.11.0",
    "python-multipart>=0.0.33",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Heavy (pulls torch); needed for the retrieval spike's parsing step.
# Install with: uv sync --group ingest
ingest = [
    "docling>=2.15",
    "pypdfium2>=4.30",  # PDF outline + text layer (already a Docling dependency)
    # Docling's own dependencies, listed so [tool.uv.sources] can send Linux to the CPU index
    "torch>=2.15",
    "torchvision>=0.29",
]

[tool.uv]
package = false

# Linux (the container images): CPU-only PyTorch, a few hundred MB instead of the CUDA build's
# several GB. Docling's layout models run fine on CPU; the GPU, when there is one, serves the
# language models (vLLM). Windows/macOS wheels on PyPI are CPU builds already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the dev Postgres container (skipped when unreachable)",
]
