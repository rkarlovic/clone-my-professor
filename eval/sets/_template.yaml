# Golden question set for one subject. Copy to eval/sets/<subject_id>.yaml.
# Holds no personal data. Used for recall@5 (step 1) and grounding/abstention (step 2+).
subject_id: example-subject
subject_name: "Primjer predmeta"
language: hr
default_document: null  # used when an expected source names no document

questions:
  - id: q001
    question: "Što je derivacija funkcije?"
    type: answerable          # answerable | out_of_scope | admin (grades/deadlines/exams -> escalate)
    difficulty: easy          # easy (worded like the slide) | hard (paraphrase, symptom, English, ...)
    expected_sources:         # any of these counts as a hit for recall@k
      - document: "predavanje-03.pdf"
        page_or_slide: 12
    reference_answer: "Derivacija opisuje brzinu promjene funkcije u točki."
    notes: ""

  - id: q002
    question: "Kada je rok za predaju zadaće?"
    type: admin
    expected_sources: []
    reference_answer: null    # the clone must abstain and forward to the teacher queue
