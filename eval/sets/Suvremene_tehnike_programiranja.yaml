# Golden question set — Suvremene tehnike programiranja (Java, OOP; slides 2016/17, CC licence)
#
# STATUS: DRAFT written by Claude from the slides, NOT yet reviewed by the teacher.
# Sources re-checked against the PDF on 2026-11-13 (by Claude, not the teacher): see notes tagged [review 2026-11-13].
# Only teacher-reviewed questions should count as the real recall@5 baseline.
#
# difficulty:
#   easy — worded close to the slide; one obvious target slide
#   hard — paraphrased or colloquial, English terms for Croatian slide wording, no diacritics,
#          a symptom instead of the concept, answers spread over several slides, or a question
#          the clone must NOT answer (out_of_scope / admin -> forward to the teacher)
# type:
#   answerable   — counts for recall@k: any expected source in the top k is a hit
#   out_of_scope — not covered by the materials: clone says so and forwards to the teacher
#   admin        — grades, deadlines, exams: always forwarded to the teacher (rule 2),
#                  even when a slide mentions it
# Pages are pages of the PDF (= slide numbers in citations).

subject_id: Suvremene_tehnike_programiranja
subject_name: "Suvremene tehnike programiranja"
language: hr
default_document: "Suvremene_tehnike_programiranja_-_Sve_prezentacije_2016-17_-_UNIPU_SSovilj.pdf"

questions:
  # ------------------------------------------------------------------ easy (25)
  - id: e01
    difficulty: easy
    type: answerable
    question: "Mogu li u jednoj klasi imati više konstruktora i vraćaju li oni neku vrijednost?"
    expected_sources: [{page_or_slide: 190}]
    reference_answer: "Da, konstruktora može biti više i mogu imati argumente, ali nemaju povratni tip, čak ni void."

  - id: e02
    difficulty: easy
    type: answerable
    question: "Kako uhvatiti nekoliko različitih iznimaka u istom catch bloku?"
    expected_sources: [{page_or_slide: 435}]
    reference_answer: "Multi-catch: tipovi iznimaka navode se u jednom catch bloku odvojeni znakom |."

  - id: e03
    difficulty: easy
    type: answerable
    question: "Zašto nije dobro uvesti cijeli paket odjednom?"
    expected_sources: [{page_or_slide: 330}]
    reference_answer: "Gubi se pregled koja su imena uvezena pa se može nehotice koristiti kriva klasa."

  - id: e04
    difficulty: easy
    type: answerable
    question: "Kako se u Javi pokreće nova dretva?"
    expected_sources: [{page_or_slide: 700}, {page_or_slide: 702}, {page_or_slide: 703}, {page_or_slide: 704}, {page_or_slide: 705}]
    reference_answer: "Napravi se objekt klase koja implementira Runnable ili nasljeđuje Thread i pozove se metoda start."
    notes: "[review 2026-11-13] 702-705 show the concrete ways (Thread subclass, Runnable, anonymous class, lambda)."

  - id: e05
    difficulty: easy
    type: answerable
    question: "Moram li implementirati sve metode sučelja FileVisitor?"
    expected_sources: [{page_or_slide: 500}]
    reference_answer: "Ne, može se naslijediti SimpleFileVisitor i nadjačati samo potrebne metode."

  - id: e06
    difficulty: easy
    type: answerable
    question: "Što je JUnit?"
    expected_sources: [{page_or_slide: 880}, {page_or_slide: 881}]
    reference_answer: "Programski okvir iz obitelji xUnit za testiranje jedinica u Javi."

  - id: e07
    difficulty: easy
    type: answerable
    question: "Treba li uvijek optimizirati kod da bude što brži?"
    expected_sources: [{page_or_slide: 920}, {page_or_slide: 921}, {page_or_slide: 919}, {page_or_slide: 922}]
    reference_answer: "Ne; ako su zahtjevi na performanse ispunjeni, ne treba gubiti vrijeme na optimizaciju — ispravnost je važnija."
    notes: "[review 2026-11-13] 919 (Knuth/Jackson quotes) and 922 (optimise only bottlenecks) answer it too."

  - id: e08
    difficulty: easy
    type: answerable
    question: "Što je singleton?"
    expected_sources: [{page_or_slide: 212}, {page_or_slide: 213}]
    reference_answer: "Kreacijski oblikovni obrazac koji osigurava da postoji samo jedan objekt klase; ostvaruje se statičkom varijablom i statičkom metodom."

  - id: e09
    difficulty: easy
    type: answerable
    question: "Koja je razlika između apstraktne klase i sučelja?"
    expected_sources: [{page_or_slide: 313}]
    reference_answer: "Apstraktna klasa može imati apstraktne i ne-apstraktne metode, razne atribute, static metode i konstruktor; klasa može naslijediti samo jednu klasu, a implementirati više sučelja. Napomena: tablica na slajdu 313 je zastarjela — od Jave 8 sučelje može imati default i static metode s tijelom (slajdovi 285, 286)."
    notes: "[review 2026-11-13] Slide 313 contradicts 285/286 (Java 8). Teacher: fix the slide or confirm the intended answer."

  - id: e10
    difficulty: easy
    type: answerable
    question: "Koja je razlika između JDK, JRE i JVM?"
    expected_sources: [{page_or_slide: 31}]
    reference_answer: "JDK sadrži alate za razvoj (javac, jar, javadoc), JRE pokreće Java aplikacije i uključuje JVM, a JVM je Java virtualni stroj."

  - id: e11
    difficulty: easy
    type: answerable
    question: "Koji modifikatori vidljivosti postoje u Javi?"
    expected_sources: [{page_or_slide: 172}, {page_or_slide: 173}, {page_or_slide: 174}, {page_or_slide: 175}]
    reference_answer: "public, protected, private i bez modifikatora (paketna vidljivost)."
    notes: "[review 2026-11-13] 173 (table of all access levels) and 174 also list them."

  - id: e12
    difficulty: easy
    type: answerable
    question: "Čemu služi ključna riječ final?"
    expected_sources: [{page_or_slide: 208}, {page_or_slide: 255}]
    reference_answer: "Varijabla se ne može mijenjati nakon inicijalizacije; final klasa se ne može nasljeđivati, a final metoda nadjačati."

  - id: e13
    difficulty: easy
    type: answerable
    question: "Kojim redoslijedom se pozivaju konstruktori kod nasljeđivanja?"
    expected_sources: [{page_or_slide: 246}, {page_or_slide: 247}]
    reference_answer: "Prvo konstruktor bazne klase (prevoditelj dodaje super()), zatim konstruktor izvedene klase."
    notes: "[review 2026-11-13] 247 explains the implicit super() call."

  - id: e14
    difficulty: easy
    type: answerable
    question: "Kako zabraniti nasljeđivanje klase?"
    expected_sources: [{page_or_slide: 255}]
    reference_answer: "Klasu treba označiti s final."

  - id: e15
    difficulty: easy
    type: answerable
    question: "Koja je razlika između preopterećenja i nadjačavanja metoda?"
    expected_sources: [{page_or_slide: 325}]
    reference_answer: "Preopterećenje je više metoda istog imena s različitim argumentima unutar klase; nadjačavanje je nova implementacija naslijeđene metode u podklasi."

  - id: e16
    difficulty: easy
    type: answerable
    question: "Što su boxing i unboxing?"
    expected_sources: [{page_or_slide: 365}, {page_or_slide: 366}]
    reference_answer: "Boxing je pretvaranje primitivnog tipa u objekt omotača, unboxing obrnuto; prevoditelj to radi automatski."

  - id: e17
    difficulty: easy
    type: answerable
    question: "Čemu služi finally blok?"
    expected_sources: [{page_or_slide: 438}, {page_or_slide: 439}]
    reference_answer: "Kod u finally bloku izvodi se uvijek, bez obzira kako je završio try-catch, npr. za zatvaranje resursa."
    notes: "[review 2026-11-13] 439 also states finally always runs."

  - id: e18
    difficulty: easy
    type: answerable
    question: "Što je try with resources?"
    expected_sources: [{page_or_slide: 455}]
    reference_answer: "Oblik try bloka (od Jave 7) koji automatski zatvara resurse koji implementiraju AutoCloseable/Closeable."

  - id: e19
    difficulty: easy
    type: answerable
    question: "Koju implementaciju sučelja Set odabrati?"
    expected_sources: [{page_or_slide: 559}, {page_or_slide: 558}, {page_or_slide: 560}]
    reference_answer: "Ovisi što algoritam dominantno radi (iteriranje, čitanje/pisanje, poredak); bira se ona koja daje potrebnu funkcionalnost i performanse."
    notes: "[review 2026-11-13] 558 gives the concrete HashSet/TreeSet/LinkedHashSet trade-offs; 560 only lists questions."

  - id: e20
    difficulty: easy
    type: answerable
    question: "Što je mapa u Javi?"
    expected_sources: [{page_or_slide: 585}]
    reference_answer: "Kolekcija parova (ključ, vrijednost) u kojoj se ključevi ne ponavljaju; modelirana sučeljem Map."

  - id: e21
    difficulty: easy
    type: answerable
    question: "Kako radi BorderLayout?"
    expected_sources: [{page_or_slide: 655}]
    reference_answer: "Dijeli prostor na pet područja (NORTH, SOUTH, EAST, WEST, CENTER), u svako ide jedna komponenta, a središte se širi najviše."

  - id: e22
    difficulty: easy
    type: answerable
    question: "Čemu služi metoda join kod dretvi?"
    expected_sources: [{page_or_slide: 714}]
    reference_answer: "Dretva koja pozove join na drugoj dretvi čeka dok ta dretva ne završi."

  - id: e23
    difficulty: easy
    type: answerable
    question: "Što je kritični odsječak i kako se označava?"
    expected_sources: [{page_or_slide: 721}]
    reference_answer: "Kod ili metoda koja iz više dretvi pristupa istom objektu; označava se ključnom riječi synchronized."

  - id: e24
    difficulty: easy
    type: answerable
    question: "Što je imitiranje objekata (mocking) u testiranju?"
    expected_sources: [{page_or_slide: 910}, {page_or_slide: 911}]
    reference_answer: "Zamjena ovisnosti imitacijom kako bi se jedinica koda testirala izolirano; na kolegiju se koristi Mockito."

  - id: e25
    difficulty: easy
    type: answerable
    question: "Kako zapakirati Java aplikaciju u JAR datoteku?"
    expected_sources: [{page_or_slide: 538}]
    reference_answer: "U IntelliJ IDEA: Project Structure > Artifacts > JAR; pokreće se s java -jar."

  # ------------------------------------------------------------------ hard (25)
  # symptom instead of concept
  - id: h01
    difficulty: hard
    type: answerable
    question: "Usporedio sam dva stringa s == i dobio false iako je tekst isti, zašto?"
    expected_sources: [{page_or_slide: 182}, {page_or_slide: 183}]
    reference_answer: "== uspoređuje reference, ne sadržaj; stringove treba uspoređivati metodom equals."

  - id: h02
    difficulty: hard
    type: answerable
    question: "Program mi puca kad brišem elemente iz liste unutar for-each petlje. Što radim krivo?"
    expected_sources: [{page_or_slide: 617}, {page_or_slide: 583}]
    reference_answer: "Mijenjanje kolekcije tijekom iteriranja baca ConcurrentModificationException (fail-fast iterator); treba brisati preko iter.remove()."

  - id: h03
    difficulty: hard
    type: answerable
    question: "Zašto mi se cijeli prozor aplikacije zamrzne dok traje neki dugi izračun nakon klika na gumb?"
    expected_sources: [{page_or_slide: 742}, {page_or_slide: 743}, {page_or_slide: 744}, {page_or_slide: 745}, {page_or_slide: 769}, {page_or_slide: 770}, {page_or_slide: 771}]
    reference_answer: "Dugi posao blokira event dispatch dretvu pa se sučelje ne iscrtava; posao treba prebaciti u pozadinsku dretvu (npr. SwingWorker)."
    notes: "[review 2026-11-13] 744 is the blocking loop itself; 770-771 explain SwingWorker. Likely a genuine retrieval gap: colloquial 'zamrzne' vs slide wording 'blokira ponovno iscrtavanje'."

  - id: h04
    difficulty: hard
    type: answerable
    question: "Kad napravim drugu varijablu od postojećeg objekta i promijenim je, promijeni se i original. Kako to?"
    expected_sources: [{page_or_slide: 343}, {page_or_slide: 344}, {page_or_slide: 205}]
    reference_answer: "Varijabla referentne vrste sadrži referencu, pa obje varijable pokazuju na isti objekt; za kopiju treba stvoriti novi objekt."

  - id: h05
    difficulty: hard
    type: answerable
    question: "Dobivam ClassCastException kad objekt iz nadklase pretvaram u podklasu."
    expected_sources: [{page_or_slide: 357}, {page_or_slide: 358}, {page_or_slide: 359}, {page_or_slide: 368}, {page_or_slide: 263}, {page_or_slide: 450}]
    reference_answer: "Downcast uspijeva samo ako objekt stvarno jest te podvrste; prije pretvorbe provjeriti s instanceof."
    notes: "[review 2026-11-13] Reference answer mentions instanceof, which is on 359 (was missing). 368 and 263 explain ClassCastException directly."

  - id: h06
    difficulty: hard
    type: answerable
    question: "Čitam tekstualnu datoteku i hrvatska slova (č, ć, š) mi se prikazuju kao čudni znakovi."
    expected_sources: [{page_or_slide: 516}, {page_or_slide: 517}, {page_or_slide: 520}, {page_or_slide: 521}]
    reference_answer: "Bajtove treba dekodirati ispravnom kodnom stranicom, npr. InputStreamReader s \"UTF-8\"."
    notes: "[review 2026-11-13] 516 explains bytes != characters and code pages."

  # English wording where the slides are Croatian
  - id: h07
    difficulty: hard
    type: answerable
    question: "How do I avoid a deadlock between threads?"
    expected_sources: [{page_or_slide: 726}, {page_or_slide: 725}, {page_or_slide: 724}]
    reference_answer: "Grupirati resurse u jedan, zauzimati resurse istim redoslijedom i sve osloboditi ako se ne mogu zauzeti, ili provjeravati dostupnost bez blokiranja."
    notes: "[review 2026-11-13] 724 defines deadlock and uses the English word 'deadlock' — the best lexical match for this English question."

  - id: h08
    difficulty: hard
    type: answerable
    question: "What is the difference between checked and unchecked exceptions?"
    expected_sources: [{page_or_slide: 449}, {page_or_slide: 450}, {page_or_slide: 451}, {page_or_slide: 452}, {page_or_slide: 454}]
    reference_answer: "Provjeravane (npr. IOException) moraju se obraditi ili najaviti s throws; neprovjeravane (npr. NullPointerException) ne moraju."
    notes: "[review 2026-11-13] 449 defines both families; 454 shows the throws rule for checked exceptions."

  - id: h09
    difficulty: hard
    type: answerable
    question: "Does Java support multiple inheritance?"
    expected_sources: [{page_or_slide: 281}, {page_or_slide: 278}, {page_or_slide: 29}, {page_or_slide: 313}]
    reference_answer: "Ne za klase; klasa može naslijediti samo jednu klasu, ali implementirati više sučelja."
    notes: "[review 2026-11-13] Old sources 279/313 did not state the rule (313 even says 'sučelje podržava višestruko nasljeđivanje'). 281 states it exactly; 278 and 29 too. 313 kept as a partial source; 279 removed (it never states the rule)."

  # no diacritics / casual typing
  - id: h10
    difficulty: hard
