  - id: h12
    difficulty: hard
    type: answerable
    question: "Zašto je bolje baciti iznimku nego vratiti -1 kao oznaku da je nešto pošlo po zlu?"
    expected_sources: [{page_or_slide: 425}, {page_or_slide: 426}, {page_or_slide: 427}]
    reference_answer: "Povratna vrijednost tada miješa podatak i status, a kod se pretvara u gomilu provjera; iznimka odvaja pogrešku od regularnog rezultata."

  - id: h13
    difficulty: hard
    type: answerable
    question: "Zašto se u Javi tokovi umataju jedan u drugi, npr. BufferedReader oko InputStreamReadera?"
    expected_sources: [{page_or_slide: 509}, {page_or_slide: 510}, {page_or_slide: 513}, {page_or_slide: 514}, {page_or_slide: 519}, {page_or_slide: 521}]
