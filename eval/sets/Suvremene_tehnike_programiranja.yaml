    question: "Mogu li tijekom izvođenja programa saznati kojim je tipom parametrizirana moja lista?"
    expected_sources: [{page_or_slide: 378}]
    reference_answer: "Ne, parametri tipa postoje samo za prevoditelj; u byte-kodu se brišu i zamjenjuju s Object (ili granicom)."

  - id: h15
    difficulty: hard
