# Dev stack for build step 1 (retrieval spike): Postgres + pgvector, Ollama, optional reranker.
# The backend runs on the host with uv (see CLAUDE.md "Commands").
# api / worker / langfuse / moodle are added in later build steps.
#   # the web pages (Vite dev server on http://127.0.0.1:5173; backend API on the host):
#   docker compose -f infra/docker-compose.dev.yml --env-file .env --profile frontend up -d frontend
#
#   docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
#   # with an NVIDIA GPU for Ollama:
#   docker compose -f infra/docker-compose.dev.yml -f infra/docker-compose.dev.gpu.yml --env-file .env up -d
#   # also start the reranker (Infinity, CPU):
#   docker compose -f infra/docker-compose.dev.yml --env-file .env --profile rerank up -d

name: cmp-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      CMP_APP_DB_USER: ${CMP_APP_DB_USER:?set in .env}
      CMP_APP_DB_PASSWORD: ${CMP_APP_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql  # PG 18 images keep data under a versioned subdirectory
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Dev-only inference server. Quantized GGUF: never compare or tune models on its output.
  # Runs as root (upstream image default); acceptable only because it is dev-only.
  ollama:
    image: ollama/ollama:0.40.11
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama  # weights live in a volume, never in the image
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Reranker (bge-reranker-v2-m3) behind a /rerank API, reached only via LiteLLM.
  infinity:
    profiles: ["rerank"]
    image: michaelf34/infinity:0.0.78-cpu
    platform: linux/amd64  # no arm64 build; runs emulated (slow) on Apple Silicon
    command: ["v2", "--model-id", "BAAI/bge-reranker-v2-m3", "--port", "7997", "--engine", "torch"]
    ports:
      - "127.0.0.1:${INFINITY_HOST_PORT:-7997}:7997"
    volumes:
      - hf_cache:/app/.cache
    restart: unless-stopped

  # Web pages (React + Vite). Dev only: source mounted with live reload; /api is proxied to the
  # backend running on the host (uvicorn on 127.0.0.1:8000, reached as host.docker.internal).
  frontend:
    profiles: ["frontend"]
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm ci && npm run dev"]
    environment:
      CMP_API_URL: http://host.docker.internal:8000
      CMP_POLL: "1"  # Windows bind mounts do not deliver file events
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  # Local Moodle to test the LTI launch and Web Services (dev only, profile "moodle"):
  #   docker compose -f infra/docker-compose.dev.yml --env-file .env --profile moodle up -d --build
  #   then once: see CLAUDE.md "Commands" (install + infra/moodle/setup_cmp.php)
  moodle-db:
    profiles: ["moodle"]
    image: pgvector/pgvector:0.8.6-pg18-trixie  # plain Postgres use; same image, no extra pull
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?set in .env}
    volumes:
      - moodle_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  moodle:
    profiles: ["moodle"]
    build:
      context: ./moodle
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?set in .env}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?set in .env}
      MOODLE_TEST_PASSWORD: ${MOODLE_TEST_PASSWORD:?set in .env}
      MOODLE_WWWROOT: http://127.0.0.1:${MOODLE_HOST_PORT:-8080}
      CMP_PUBLIC_URL: http://127.0.0.1:${FRONTEND_HOST_PORT:-5173}
    ports:
      - "127.0.0.1:${MOODLE_HOST_PORT:-8080}:80"
    volumes:
      - moodle_data:/var/www/moodledata
      - ./moodle/config.php:/var/www/html/config.php:ro
      - ./moodle/setup_cmp.php:/opt/cmp/setup_cmp.php:ro
    restart: unless-stopped

volumes:
  pgdata:
  moodle_pgdata:
  moodle_data:
  frontend_node_modules:
  ollama_models:
  hf_cache:
